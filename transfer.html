<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقل المنتجات إلى Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #0f172a; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 20px; }
        button { background: #0284c7; color: white; border: none; padding: 12px 24px; border-radius: 30px; cursor: pointer; font-size: 1rem; margin: 10px 0; }
        button:disabled { background: #475569; cursor: not-allowed; }
        pre { background: #0f172a; padding: 15px; border-radius: 10px; overflow-x: auto; font-size: 12px; }
        .log { background: #0f172a; padding: 15px; border-radius: 10px; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .warning { color: #fbbf24; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔄 نقل المنتجات من API إلى Supabase</h1>
    <p>⚠️ سيتم نقل جميع المنتجات والأقسام من API الدروب شيبينغ إلى قاعدة بيانات Supabase</p>
    <button id="startBtn" onclick="startTransfer()">🚀 بدء النقل</button>
    <button id="clearBtn" onclick="clearData()" style="background:#e63946;">🗑️ مسح البيانات الحالية</button>
    <div id="log" class="log">📋 جاهز...</div>
</div>

<script>
    // ==========================================
    // إعدادات Supabase (نفس المستخدم الأساسي)
    // ==========================================
    const SUPABASE_URL = "https://ymfxhrbjqubgpgxzhoqx.supabase.co";
    const SUPABASE_SERVICE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InltZnhocmJqcXViZ3BneHpob3F4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3OTk1NzQzOSwiZXhwIjoyMDk1NTMzNDM5fQ.VT0B4YeoWiZIY-_DLTlaYcz3Dn2Rrmqc6N1VVD-w18E";
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_SERVICE_KEY);
    
    // إعدادات API
    const API_TOKEN = "t1JI0lA";
    const API_BASE_URL = "https://rolemall.com/api";
    
    let logDiv = document.getElementById('log');
    
    function log(message, type = 'info') {
        const color = type === 'error' ? '🔴' : (type === 'success' ? '🟢' : (type === 'warning' ? '🟡' : '🔵'));
        logDiv.innerHTML += `<div class="${type}">${color} ${message}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
        console.log(message);
    }
    
    function extractData(data, type) {
        if (data && data.data && data.data[type] && Array.isArray(data.data[type])) {
            return data.data[type];
        }
        if (data && data[type] && Array.isArray(data[type])) {
            return data[type];
        }
        return [];
    }
    
    // ==========================================
    // جلب الأقسام من API
    // ==========================================
    async function fetchCategoriesFromAPI() {
        log("🔄 جلب الأقسام من API...");
        const response = await fetch(`${API_BASE_URL}/categories/`);
        const data = await response.json();
        const extracted = extractData(data, 'categories');
        log(`✅ تم جلب ${extracted.length} قسم من API`);
        return extracted.map(cat => ({
            id: cat._id || cat.id,
            name: cat.name,
            icon: cat.img ? '🖼️' : '📁'
        }));
    }
    
    // ==========================================
    // جلب جميع المنتجات من API
    // ==========================================
    async function fetchAllProductsFromAPI() {
        let allProducts = [];
        let page = 1;
        let hasMore = true;
        
        log("🔄 جلب المنتجات من API (قد يستغرق وقتاً)...");
        
        while (hasMore) {
            try {
                const url = `${API_BASE_URL}/products/?token=${API_TOKEN}&page=${page}&limit=100`;
                const response = await fetch(url);
                const data = await response.json();
                const products = extractData(data, 'products');
                
                if (products.length > 0) {
                    allProducts = [...allProducts, ...products];
                    log(`📦 الصفحة ${page}: تم جلب ${products.length} منتج (المجموع: ${allProducts.length})`);
                    page++;
                } else {
                    hasMore = false;
                }
                
                if (products.length < 100) hasMore = false;
                
            } catch (error) {
                log(`❌ خطأ في الصفحة ${page}: ${error.message}`, 'error');
                hasMore = false;
            }
        }
        
        log(`✅ تم جلب ${allProducts.length} منتج من API`, 'success');
        return allProducts;
    }
    
    // ==========================================
    // إضافة الأقسام إلى Supabase
    // ==========================================
    async function insertCategories(categories) {
        log("🔄 إضافة الأقسام إلى Supabase...");
        
        // حذف الأقسام القديمة أولاً
        await supabase.from('categories').delete().neq('id', 0);
        
        let inserted = 0;
        for (const cat of categories) {
            const { error } = await supabase
                .from('categories')
                .insert([{
                    id: cat.id,
                    name: cat.name,
                    icon: cat.icon
                }]);
            
            if (error) {
                log(`❌ فشل إضافة قسم ${cat.name}: ${error.message}`, 'error');
            } else {
                inserted++;
            }
        }
        
        log(`✅ تم إضافة ${inserted} قسم إلى Supabase`, 'success');
    }
    
    // ==========================================
    // إضافة المنتجات إلى Supabase
    // ==========================================
    async function insertProducts(products) {
        log("🔄 إضافة المنتجات إلى Supabase...");
        
        // حذف المنتجات القديمة أولاً
        await supabase.from('products').delete().neq('id', 0);
        
        let inserted = 0;
        let failed = 0;
        
        for (const p of products) {
            const productData = {
                id: p._id,
                name: p.name,
                price: p.price || p.sale_price || 0,
                image: p.img || p.image || p.main_image || 'https://placehold.co/400x400/0284c7/white?text=منتج',
                description: p.description || p.body || 'لا يوجد وصف',
                category_id: p.category_id || null,
                stock: p.stock || 10
            };
            
            const { error } = await supabase
                .from('products')
                .insert([productData]);
            
            if (error) {
                log(`❌ فشل إضافة ${p.name}: ${error.message}`, 'error');
                failed++;
            } else {
                inserted++;
                if (inserted % 50 === 0) {
                    log(`📦 تم إضافة ${inserted} منتج...`);
                }
            }
        }
        
        log(`✅ تم إضافة ${inserted} منتج إلى Supabase (فشل: ${failed})`, 'success');
    }
    
    // ==========================================
    // الوظيفة الرئيسية
    // ==========================================
    async function startTransfer() {
        const btn = document.getElementById('startBtn');
        btn.disabled = true;
        btn.innerText = "⏳ جاري النقل...";
        logDiv.innerHTML = "";
        log("🚀 بدء عملية نقل المنتجات من API إلى Supabase");
        
        try {
            // 1. جلب الأقسام من API
            const categories = await fetchCategoriesFromAPI();
            if (categories.length > 0) {
                await insertCategories(categories);
            }
            
            // 2. جلب المنتجات من API
            const products = await fetchAllProductsFromAPI();
            if (products.length > 0) {
                await insertProducts(products);
            }
            
            log("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━", 'success');
            log("🎉 اكتمل النقل بنجاح! يمكنك الآن استخدام المتجر الأساسي.", 'success');
            log("📊 المنتجات في Supabase: " + products.length, 'success');
            log("📊 الأقسام في Supabase: " + categories.length, 'success');
            
        } catch (error) {
            log(`❌ خطأ عام: ${error.message}`, 'error');
        } finally {
            btn.disabled = false;
            btn.innerText = "🚀 بدء النقل";
        }
    }
    
    // ==========================================
    // مسح البيانات
    // ==========================================
    async function clearData() {
        if (confirm("⚠️ هل أنت متأكد من مسح جميع المنتجات والأقسام من Supabase؟")) {
            log("🗑️ جاري مسح البيانات...");
            await supabase.from('products').delete().neq('id', 0);
            await supabase.from('categories').delete().neq('id', 0);
            log("✅ تم مسح جميع البيانات", 'success');
        }
    }
</script>
</body>
</html>
