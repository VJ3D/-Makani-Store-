<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقل المنتجات إلى Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: monospace; background: #0f172a; color: #4ade80; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 15px; }
        button { background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; margin: 5px; }
        .log { background: #0f172a; padding: 15px; border-radius: 10px; max-height: 500px; overflow-y: auto; font-size: 12px; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .info { color: #60a5fa; }
    </style>
</head>
<body>
<div class="container">
    <h2>🔄 نقل المنتجات من API إلى Supabase</h2>
    <button id="startBtn" onclick="startTransfer()">🚀 بدء النقل</button>
    <button id="clearBtn" onclick="clearData()" style="background:#e63946;">🗑️ مسح البيانات</button>
    <div id="log" class="log">📋 جاهز...</div>
</div>

<script>
    // ==========================================
    // إعدادات Supabase
    // ==========================================
    const SUPABASE_URL = "https://ymfxhrbjqubgpgxzhoqx.supabase.co";
    const SUPABASE_SERVICE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InltZnhocmJqcXViZ3BneHpob3F4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3OTk1NzQzOSwiZXhwIjoyMDk1NTMzNDM5fQ.VT0B4YeoWiZIY-_DLTlaYcz3Dn2Rrmqc6N1VVD-w18E";
    
    const API_TOKEN = "t1JI0lA";
    const API_BASE_URL = "https://rolemall.com/api";
    
    let supabase;
    let logDiv = document.getElementById('log');
    
    function log(msg, type = 'info') {
        const color = type === 'error' ? '🔴' : (type === 'success' ? '🟢' : '🔵');
        logDiv.innerHTML += `<div class="${type}">${color} ${msg}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
        console.log(msg);
    }
    
    // تهيئة Supabase
    function initSupabase() {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_SERVICE_KEY);
        log("✅ تم الاتصال بـ Supabase", 'success');
    }
    
    // ==========================================
    // استخراج البيانات من الاستجابة
    // ==========================================
    function extractData(data, type) {
        // البيانات في المسار: data.data.{type}
        if (data && data.data && data.data[type] && Array.isArray(data.data[type])) {
            log(`📦 وجدت ${data.data[type].length} ${type} في data.data.${type}`, 'success');
            return data.data[type];
        }
        if (data && data[type] && Array.isArray(data[type])) {
            log(`📦 وجدت ${data[type].length} ${type} في data.${type}`, 'success');
            return data[type];
        }
        if (Array.isArray(data)) {
            log(`📦 وجدت ${data.length} ${type} كمصفوفة`, 'success');
            return data;
        }
        log(`⚠️ لم أجد ${type} - المفاتيح: ${Object.keys(data).join(', ')}`, 'error');
        return [];
    }
    
    // ==========================================
    // جلب الأقسام من API
    // ==========================================
    async function fetchCategories() {
        log("🔄 جلب الأقسام من API...");
        try {
            const response = await fetch(`${API_BASE_URL}/categories/`);
            const data = await response.json();
            const categories = extractData(data, 'categories');
            return categories.map(c => ({
                id: c._id || c.id,
                name: c.name,
                icon: c.img ? '🖼️' : '📁'
            }));
        } catch (error) {
            log(`❌ فشل جلب الأقسام: ${error.message}`, 'error');
            return [];
        }
    }
    
    // ==========================================
    // جلب جميع المنتجات من API
    // ==========================================
    async function fetchAllProducts() {
        let allProducts = [];
        let page = 1;
        let hasMore = true;
        
        log("🔄 جلب المنتجات من API (قد يستغرق وقتاً)...");
        
        while (hasMore) {
            try {
                const url = `${API_BASE_URL}/products/?token=${API_TOKEN}&page=${page}&limit=100`;
                const response = await fetch(url);
                const data = await response.json();
                const products = extractData(data, 'products');
                
                if (products.length > 0) {
                    allProducts = [...allProducts, ...products];
                    log(`📦 الصفحة ${page}: ${products.length} منتج (المجموع: ${allProducts.length})`);
                    page++;
                } else {
                    hasMore = false;
                }
                
                if (products.length < 100) hasMore = false;
                
            } catch (error) {
                log(`❌ خطأ في الصفحة ${page}: ${error.message}`, 'error');
                hasMore = false;
            }
        }
        
        log(`✅ تم جلب ${allProducts.length} منتج من API`, 'success');
        return allProducts;
    }
    
    // ==========================================
    // إضافة المنتجات إلى Supabase
    // ==========================================
    async function insertProducts(products) {
        log("🔄 إضافة المنتجات إلى Supabase...");
        
        let inserted = 0;
        let failed = 0;
        
        for (let i = 0; i < products.length; i++) {
            const p = products[i];
            const productData = {
                id: p._id || p.id,
                name: p.name || 'منتج بدون اسم',
                price: p.price || p.sale_price || 0,
                image: p.img || p.image || p.main_image || null,
                description: p.description || p.body || null,
                category_id: p.category_id || null
            };
            
            const { error } = await supabase
                .from('products')
                .upsert([productData], { onConflict: 'id' });
            
            if (error) {
                log(`❌ فشل إضافة ${p.name}: ${error.message}`, 'error');
                failed++;
            } else {
                inserted++;
                if (inserted % 50 === 0) {
                    log(`📦 تم إضافة ${inserted} منتج...`);
                }
            }
        }
        
        log(`✅ تم إضافة ${inserted} منتج (فشل: ${failed})`, 'success');
    }
    
    // ==========================================
    // إضافة الأقسام إلى Supabase
    // ==========================================
    async function insertCategories(categories) {
        log("🔄 إضافة الأقسام إلى Supabase...");
        
        let inserted = 0;
        for (const cat of categories) {
            const { error } = await supabase
                .from('categories')
                .upsert([{
                    id: cat.id,
                    name: cat.name,
                    icon: cat.icon
                }], { onConflict: 'id' });
            
            if (error) {
                log(`❌ فشل إضافة قسم ${cat.name}: ${error.message}`, 'error');
            } else {
                inserted++;
            }
        }
        
        log(`✅ تم إضافة ${inserted} قسم`, 'success');
    }
    
    // ==========================================
    // الوظيفة الرئيسية
    // ==========================================
    async function startTransfer() {
        const btn = document.getElementById('startBtn');
        btn.disabled = true;
        btn.innerText = "⏳ جاري النقل...";
        logDiv.innerHTML = "🚀 بدء عملية النقل...<br>";
        
        try {
            initSupabase();
            
            // 1. جلب الأقسام وإضافتها
            const categories = await fetchCategories();
            if (categories.length > 0) {
                await insertCategories(categories);
            }
            
            // 2. جلب المنتجات وإضافتها
            const products = await fetchAllProducts();
            if (products.length > 0) {
                await insertProducts(products);
            }
            
            log("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━", 'success');
            log(`🎉 اكتمل النقل! ${products.length} منتج و ${categories.length} قسم`, 'success');
            
        } catch (error) {
            log(`❌ خطأ عام: ${error.message}`, 'error');
        } finally {
            btn.disabled = false;
            btn.innerText = "🚀 بدء النقل";
        }
    }
    
    // ==========================================
    // مسح البيانات
    // ==========================================
    async function clearData() {
        if (!confirm("⚠️ هل أنت متأكد من مسح جميع المنتجات والأقسام من Supabase؟")) return;
        
        initSupabase();
        log("🗑️ جاري مسح البيانات...");
        await supabase.from('products').delete().neq('id', 0);
        await supabase.from('categories').delete().neq('id', 0);
        log("✅ تم مسح جميع البيانات", 'success');
    }
</script>
</body>
</html>
