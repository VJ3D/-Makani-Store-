<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقل المنتجات - مكاني ستور</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: monospace; background: #0f172a; color: #4ade80; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 15px; }
        button { background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; margin: 5px; }
        .log { background: #0f172a; padding: 15px; border-radius: 10px; max-height: 500px; overflow-y: auto; font-size: 12px; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .info { color: #60a5fa; }
    </style>
</head>
<body>
<div class="container">
    <h2>🔄 نقل المنتجات من API إلى Supabase</h2>
    <button id="startBtn" onclick="startTransfer()">🚀 بدء النقل</button>
    <button id="clearBtn" onclick="clearData()" style="background:#e63946;">🗑️ مسح البيانات</button>
    <div id="log" class="log">📋 جاهز... اضغط "بدء النقل"<br></div>
</div>

<script>
    // ==========================================
    // عرض الأخطاء على الشاشة
    // ==========================================
    window.onerror = function(msg, url, line) {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += `<div class="error">🔴 خطأ في السطر ${line}: ${msg}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
        return false;
    };
    
    const SUPABASE_URL = "https://ymfxhrbjqubgpgxzhoqx.supabase.co";
    const SUPABASE_SERVICE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InltZnhocmJqcXViZ3BneHpob3F4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3OTk1NzQzOSwiZXhwIjoyMDk1NTMzNDM5fQ.VT0B4YeoWiZIY-_DLTlaYcz3Dn2Rrmqc6N1VVD-w18E";
    const API_TOKEN = "t1JI0lA";
    const API_BASE_URL = "https://rolemall.com/api";
    
    let supabase;
    let logDiv = document.getElementById('log');
    
    function log(msg, type = 'info') {
        const prefix = type === 'error' ? '🔴' : (type === 'success' ? '🟢' : '🔵');
        logDiv.innerHTML += `<div class="${type}">${prefix} ${msg}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
        console.log(msg);
    }
    
    async function startTransfer() {
        log("🚀 بدء النقل...", 'info');
        
        try {
            // تهيئة Supabase
            log("📡 تهيئة الاتصال بـ Supabase...", 'info');
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_SERVICE_KEY);
            log("✅ تم الاتصال بـ Supabase", 'success');
            
            // ==========================================
            // 1. جلب الأقسام
            // ==========================================
            log("🔄 جلب الأقسام من API...", 'info');
            const catResponse = await fetch(`${API_BASE_URL}/categories/`);
            const catData = await catResponse.json();
            log(`📦 استجابة الأقسام: ${catResponse.status}`, 'info');
            
            let categories = [];
            if (catData.data && catData.data.categories) {
                categories = catData.data.categories;
            } else if (catData.categories) {
                categories = catData.categories;
            }
            log(`✅ تم جلب ${categories.length} قسم`, 'success');
            
            // إضافة الأقسام إلى Supabase
            for (let c of categories) {
                const { error } = await supabase.from('categories').upsert([{
                    id: c._id,
                    name: c.name,
                    icon: '📁'
                }]);
                if (error) log(`⚠️ خطأ في قسم ${c.name}: ${error.message}`, 'error');
            }
            log(`✅ تم إضافة ${categories.length} قسم إلى Supabase`, 'success');
            
            // ==========================================
            // 2. جلب المنتجات
            // ==========================================
            log("🔄 جلب المنتجات من API (قد يستغرق 2-3 دقائق)...", 'info');
            
            let allProducts = [];
            let page = 1;
            let hasMore = true;
            
            while (hasMore) {
                const url = `${API_BASE_URL}/products/?token=${API_TOKEN}&page=${page}&limit=100`;
                log(`📡 جلب الصفحة ${page}...`, 'info');
                const response = await fetch(url);
                const data = await response.json();
                
                let products = [];
                if (data.data && data.data.products) {
                    products = data.data.products;
                } else if (data.products) {
                    products = data.products;
                }
                
                if (products.length > 0) {
                    allProducts = [...allProducts, ...products];
                    log(`📦 الصفحة ${page}: ${products.length} منتج (المجموع: ${allProducts.length})`, 'success');
                    page++;
                }
                
                if (products.length < 100) hasMore = false;
            }
            
            log(`✅ تم جلب ${allProducts.length} منتج من API`, 'success');
            
            // ==========================================
            // 3. إضافة المنتجات إلى Supabase
            // ==========================================
            log("🔄 إضافة المنتجات إلى Supabase...", 'info');
            
            let inserted = 0;
            for (let p of allProducts) {
                const { error } = await supabase.from('products').upsert([{
                    id: p._id,
                    name: p.name || 'منتج',
                    price: p.price || p.sale_price || 0,
                    image: p.img || p.image || null,
                    description: p.description || p.body || null,
                    category_id: p.category_id || null
                }]);
                
                if (error) {
                    log(`❌ فشل إضافة ${p.name}: ${error.message}`, 'error');
                } else {
                    inserted++;
                    if (inserted % 50 === 0) {
                        log(`📦 تم إضافة ${inserted} منتج...`, 'info');
                    }
                }
            }
            
            log(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`, 'success');
            log(`🎉 اكتمل النقل بنجاح!`, 'success');
            log(`📊 المنتجات: ${inserted} منتج`, 'success');
            log(`📊 الأقسام: ${categories.length} قسم`, 'success');
            
        } catch (error) {
            log(`❌ خطأ عام: ${error.message}`, 'error');
            log(`❌ تفاصيل: ${error.stack}`, 'error');
        }
    }
    
    async function clearData() {
        if (!confirm("⚠️ هل أنت متأكد من مسح جميع البيانات؟")) return;
        
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_SERVICE_KEY);
            log("🗑️ جاري مسح المنتجات...", 'info');
            await supabase.from('products').delete().neq('id', 0);
            log("🗑️ جاري مسح الأقسام...", 'info');
            await supabase.from('categories').delete().neq('id', 0);
            log("✅ تم مسح جميع البيانات", 'success');
        } catch (error) {
            log(`❌ خطأ في المسح: ${error.message}`, 'error');
        }
    }
    
    // اختبار بسيط أن الصفحة تعمل
    log("✅ الصفحة جاهزة. اضغط 'بدء النقل'", 'success');
</script>
</body>
</html>
