<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات - مكاني ستور</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        .cart-page { display: grid; grid-template-columns: 1fr 1.2fr; gap: 30px; margin: 40px 0; }
        @media (max-width: 768px) { .cart-page { grid-template-columns: 1fr; } }
        .cart-items-container, .order-summary { background: white; border-radius: 24px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #eef2f6; flex-wrap: wrap; gap: 10px; }
        .quantity-control button { width: 32px; height: 32px; border-radius: 50%; border: none; background: #f0f4f8; cursor: pointer; }
        .whatsapp-submit { background: #25D366; color: white; border: none; width: 100%; padding: 15px; border-radius: 50px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .order-form input, .order-form textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #e2e8f0; border-radius: 16px; }
        .total-row { display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: bold; padding: 15px 0; border-top: 2px solid #eef2f6; }
    </style>
</head>
<body>

<div class="top-bar">...</div>
<header>...</header>

<main class="container">
    <div class="cart-page">
        <div class="cart-items-container">
            <h3>🛍️ سلة المشتريات</h3>
            <div id="cart-items-list"></div>
        </div>
        <div class="order-summary">
            <h3>📋 معلومات الطلب</h3>
            <div class="total-row"><span>الإجمالي:</span><span id="cart-total">0 ريال</span></div>
            <form id="order-form">
                <input type="text" id="customer-name" placeholder="الاسم الكامل" required>
                <input type="tel" id="customer-phone" placeholder="رقم الجوال (واتساب)" required>
                <textarea id="customer-address" rows="3" placeholder="العنوان بالتفصيل" required></textarea>
                <button type="submit" class="whatsapp-submit">📱 إرسال الطلب عبر واتساب</button>
            </form>
        </div>
    </div>
</main>

<footer>...</footer>
<script src="script.js"></script>
</body>
</html>
